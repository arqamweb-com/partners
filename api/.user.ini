; حدود رفع الملفات — الحد المعلن 8 ميجا للملف نفسه،
; و post_max_size أكبر منه لأن الطلب يحمل الملف + ترويسات النموذج.
; هذا الملف يعمل مع PHP-FPM/CGI (الشائع على الاستضافة المشتركة).
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 20

; تحذيرات PHP يجب ألا تُطبع أبدًا: الردود كلها JSON، وأي نص قبلها يفسدها.
; (تجاوز حجم الطلب مثلًا يولّد تحذيرًا قبل أن يبدأ index.php أصلًا)
display_errors = 0
